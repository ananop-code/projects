{% extends 'base.html' %}


{% block title %} HISTORY PAGE {% endblock %}

{% block content %}
<h1>This is History page</h1>
<div class="row">
    {% for history in histories %}
    <div class="col">
        <div class="card" style="width: 18rem;">
            <img src="/static/images/{{ history.image }}" class="card-img-top" alt="Movie Poster Image">
            <div class="card-body">
                <h5 class="card-title">{{ history.title }}</h5>
                <p class="card-text">{{ history.year }}</p>
                <a href="/history/{{ history.id }}" class="btn btn-primary">See details</a>
                {% if role == "admin" %}
                <a href="/delete_history/{{ history.id }}" class="btn btn-danger">Delete History</a>
                <a href="/update_history/{{ history.id }}" class="btn btn-info mt-2">Update History</a>
                {% endif %}
            </div>
        </div>
    </div>
    {% endfor %}
