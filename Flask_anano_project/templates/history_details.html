{% extends 'base.html' %}

{% block title %} {{ history.title }} {% endblock %}

{% block content %}
<a href="/" class="nav-link"> ⬅️ back</a>
<h1>Details about {{ history.title }}</h1>
<hr>
<div class="row">
    <div class="col">
        <div class="card" style="width: 18rem;">
            <img src="/static/images/{{ history.image }}" class="card-img-top" alt="History Poster Image">
            <div class="card-body">
                <h5 class="card-title">{{ history.title }}</h5>
                <p class="card-text">{{ history.year }}</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
